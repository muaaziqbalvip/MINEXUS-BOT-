name: "⚡ MINEXUS AI Signal Bot — 24/7 GitHub Cloud Runner"

on:
  workflow_dispatch:          # Manual launch from GitHub Actions tab
  schedule:
    - cron: '0 */5 * * *'    # Auto re-trigger every 5 hours as keepalive

jobs:
  minexus-bot:
    name: MINEXUS Signal Scanner
    runs-on: ubuntu-latest
    timeout-minutes: 355      # Run for ~5h 55m before cron re-triggers

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: "🔑 Verify Secrets"
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "❌ TELEGRAM_BOT_TOKEN is not set! Add it in repo Settings > Secrets."
            exit 1
          fi
          if [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "❌ TELEGRAM_CHAT_ID is not set! Add it in repo Settings > Secrets."
            exit 1
          fi
          echo "✅ Secrets verified. Launching MINEXUS Bot..."
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: "⚡ Run MINEXUS AI Signal Bot"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python MINEXUS_AI_Bot/main.py

      - name: "📝 Upload Bot Logs"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minexus-logs-${{ github.run_id }}
          path: minexus_bot.log
          retention-days: 7
